name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling the monitor workflow every week resets that timer.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
