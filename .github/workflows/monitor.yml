name: Deye monitor

on:
  schedule:
    - cron: "*/15 * * * *"  # fallback; the Cloudflare worker starts this every 5 min
  workflow_dispatch:
    inputs:
      command:
        description: "Bot command to answer (week, month, battery, history, stats, errors); empty = monitoring run"
        required: false
        default: ""

concurrency:
  # command runs only read the state, so they don't queue behind (or cancel) monitoring runs
  group: deye-monitor-${{ inputs.command && 'command' || 'tick' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQLite file (outage history, last state) lives in the Actions cache between runs.
      - name: Restore state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: deye-db-${{ github.run_id }}
          restore-keys: deye-db-

      - name: Check inverter and answer bot commands
        run: |
          case "$COMMAND" in
            ""|week|month|battery|history|stats|errors) ;;
            *) echo "unknown command"; exit 1 ;;
          esac
          python -m deye_monitor once ${COMMAND:+--command "$COMMAND"}
        env:
          COMMAND: ${{ inputs.command }}
          TELEGRAM_POLL: "0"
          LIVE_ALERTS: worker
          WORKER_URL: https://deye-monitor-bot.dzenplanning.workers.dev
          CACHE_SECRET: ${{ secrets.CACHE_SECRET }}
          DEYE_ENV_FILE: /dev/null
          DEYE_MODE: cloud
          DEYE_CLOUD_APP_ID: ${{ secrets.DEYE_CLOUD_APP_ID }}
          DEYE_CLOUD_APP_SECRET: ${{ secrets.DEYE_CLOUD_APP_SECRET }}
          DEYE_CLOUD_EMAIL: ${{ secrets.DEYE_CLOUD_EMAIL }}
          DEYE_CLOUD_PASSWORD_SHA256: ${{ secrets.DEYE_CLOUD_PASSWORD_SHA256 }}
          DEYE_CLOUD_STATION_ID: ${{ secrets.DEYE_CLOUD_STATION_ID }}
          DEYE_CLOUD_DEVICE_SN: ${{ secrets.DEYE_CLOUD_DEVICE_SN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # runs are 5–15 min apart, so alert on lost data a bit later than an always-on server
          UNREACHABLE_ALERT_AFTER: "900"

      - name: Save state
        if: always() && inputs.command == ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: deye-db-${{ github.run_id }}
