<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deye монітор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --card: #ffffff; --surface-1: #fcfcfb; --line: #e6e5e0;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
  --series-1: #2a78d6; --series-1-soft: rgba(42,120,214,.14);
  --good: #0ca30c; --good-text: #006300; --good-soft: rgba(12,163,12,.12);
  --critical: #d03b3b; --critical-soft: rgba(208,59,59,.14);
  --warning: #fab219; --warning-soft: rgba(250,178,25,.18);
  --track: #ecebe7; --nodata: #e3e2dd;
  --seq-0: #f0efec; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --card: #1a1a19; --surface-1: #1a1a19; --line: #2c2c2a;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-1-soft: rgba(57,135,229,.2);
    --good-text: #5fd35f; --good-soft: rgba(12,163,12,.2); --critical-soft: rgba(208,59,59,.22);
    --warning-soft: rgba(250,178,25,.2); --track: #2c2c2a; --nodata: #2a2a28;
    --seq-0: #383835; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --card: #1a1a19; --surface-1: #1a1a19; --line: #2c2c2a;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-1-soft: rgba(57,135,229,.2);
  --good-text: #5fd35f; --good-soft: rgba(12,163,12,.2); --critical-soft: rgba(208,59,59,.22);
  --warning-soft: rgba(250,178,25,.2); --track: #2c2c2a; --nodata: #2a2a28;
  --seq-0: #383835; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text-primary);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 28px; }
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); }
h2 { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
  color: var(--text-muted); margin: 0 0 12px; }
.muted { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.num { font-variant-numeric: tabular-nums; }

/* hero */
.hero { padding: 20px 18px; position: relative; overflow: hidden; }
.hero.on { background: linear-gradient(135deg, var(--good-soft), transparent 70%), var(--card); }
.hero.off { background: linear-gradient(135deg, var(--critical-soft), transparent 70%), var(--card); }
.hero.stale { background: linear-gradient(135deg, var(--warning-soft), transparent 70%), var(--card); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px; background: var(--card); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; }
.on .pill .dot { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 2s infinite; }
.off .pill .dot { background: var(--critical); box-shadow: 0 0 0 0 var(--critical); animation: pulse 2s infinite; }
.stale .pill .dot { background: var(--warning); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 currentColor; opacity: 1 } 70% { box-shadow: 0 0 0 8px transparent; } 100% { opacity: 1 } }
.hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 12px 0 2px; line-height: 1.1; }
.hero .for { font-size: 20px; font-weight: 600; }
.hero .meta { margin-top: 6px; font-size: 13px; }
.hero .emoji { position: absolute; right: 14px; top: 10px; font-size: 64px; opacity: .9; }

/* battery + flow */
.row { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 440px) { .row { grid-template-columns: 150px 1fr; } }
.ring { display: grid; place-items: center; text-align: center; }
.ring svg { width: 132px; height: 132px; }
.ring .pct { font-size: 28px; font-weight: 700; }
.ring .sub { font-size: 12px; margin-top: 2px; }
.flow svg { width: 100%; height: auto; display: block; }
.flow text { font-size: 12px; fill: var(--text-secondary); }
.flow .val { font-size: 13px; font-weight: 600; fill: var(--text-primary); }
.flow .node { fill: var(--surface-1); stroke: var(--line); stroke-width: 1.5; }
.flow .wire { stroke: var(--line); stroke-width: 3; fill: none; stroke-linecap: round; }
.flow .live { stroke: var(--series-1); stroke-width: 3; fill: none; stroke-linecap: round;
  stroke-dasharray: 2 10; animation: flow 1s linear infinite; }
.flow .live.rev { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -12; } }
@media (prefers-reduced-motion: reduce) { .flow .live, .pill .dot { animation: none; } }

/* tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.tile .k { font-size: 12px; color: var(--text-muted); }
.tile .v { font-size: 21px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; white-space: nowrap; }
.tile .v small { font-size: 14px; font-weight: 600; }
.tile .d { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* charts */
.chart { position: relative; }
.chart svg { width: 100%; display: block; overflow: visible; }
.axis { font-size: 11px; fill: var(--text-muted); }
.grid { stroke: var(--line); stroke-width: 1; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--text-primary); color: var(--bg);
  font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 8px; opacity: 0; transition: opacity .1s;
  white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.tip.show { opacity: .95; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* outages list */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--warning-soft); color: var(--text-secondary); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; padding: 5px 10px; border-radius: 999px; background: var(--surface-1); border: 1px solid var(--line); }
footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
button.refresh { background: none; border: 0; color: var(--series-1); font: inherit; padding: 6px; cursor: pointer; }
.err { padding: 40px 20px; text-align: center; }
.skeleton { height: 120px; border-radius: 18px; background: var(--card); margin-bottom: 12px; opacity: .6; }
details summary { cursor: pointer; font-size: 13px; color: var(--series-1); margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
td, th { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<main id="app">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</main>
<div class="tip" id="tip"></div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const TZ = "Europe/Kyiv";
const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
let state = { live: null, data: null, generated_at: null };

if (tg && tg.initData) {  // inside Telegram: follow the app's theme; elsewhere the OS setting applies
  tg.ready(); tg.expand();
  const apply = () => { document.documentElement.dataset.theme = tg.colorScheme === "dark" ? "dark" : "light"; };
  apply(); tg.onEvent("themeChanged", apply);
}

// ---------- formatting
function dur(sec) {
  const m = Math.round(sec / 60);
  if (m < 1) return "менше хвилини";
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  return [d && `${d} д`, h && `${h} год`, mm && !d && `${mm} хв`].filter(Boolean).join(" ");
}
const fmt = (opts) => new Intl.DateTimeFormat("uk-UA", { timeZone: TZ, ...opts });
const hm = (t) => fmt({ hour: "2-digit", minute: "2-digit" }).format(new Date(t * 1000));
const dmy = (t) => fmt({ day: "numeric", month: "short" }).format(new Date(t * 1000));
const wd = (t) => fmt({ weekday: "short" }).format(new Date(t * 1000));
const n1 = (x) => (x === null || x === undefined ? "—" : (Math.round(x * 10) / 10).toLocaleString("uk-UA"));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const localParts = (t) => {
  const p = Object.fromEntries(fmt({ year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
    .formatToParts(new Date(t * 1000)).map((x) => [x.type, x.value]));
  return { h: Number(p.hour), m: Number(p.minute), date: `${p.year}-${p.month}-${p.day}` };
};

// ---------- tooltip
const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.classList.add("show");
  const x = Math.min(Math.max(e.clientX, 70), window.innerWidth - 70);
  tip.style.left = x + "px"; tip.style.top = e.clientY + "px";
}
const hideTip = () => tip.classList.remove("show");
document.addEventListener("scroll", hideTip, { passive: true });

// ---------- data
async function load() {
  if (new URLSearchParams(location.search).has("demo")) {
    const r = await fetch("demo.json"); return r.json();
  }
  if (!tg || !tg.initData) throw new Error("Відкрий дашборд через бота в Telegram");
  const r = await fetch("/api/data", { headers: { "X-Telegram-Init-Data": tg.initData } });
  if (r.status === 403) throw new Error("Немає доступу: дашборд доступний лише власнику бота");
  if (!r.ok) throw new Error(`Помилка ${r.status}`);
  return r.json();
}

async function refresh() {
  try {
    state = await load();
    render();
  } catch (e) {
    if (!state.data && !state.live) document.getElementById("app").innerHTML = `<div class="card err">${esc(e.message)}</div>`;
  }
}

// ---------- render
function render() {
  hideTip();
  const { live, data } = state;
  const parts = [hero(live, data), batteryAndFlow(live), tiles(data), today(data, live), week(data),
                 heat(data), daily(data), outageList(data), extra(data), footer(live)];
  document.getElementById("app").innerHTML = parts.filter(Boolean).join("");
  bindHovers();
}

function hero(L, D) {
  if (!L || L.error) {
    return `<section class="card hero stale"><span class="pill"><span class="dot"></span>Немає зв'язку з Deye</span>
      <div class="big">Дані недоступні</div><div class="meta sec">${esc((L && L.error) || "")}</div></section>`;
  }
  if (L.stale) {
    return `<section class="card hero stale"><div class="emoji">📵</div>
      <span class="pill"><span class="dot"></span>Немає свіжих даних</span>
      <div class="big">Deye мовчить</div>
      <div class="for">${L.updated ? dur(L.now - L.updated) : ""}</div>
      <div class="meta sec">Найімовірніше, у квартирі немає світла й інтернету, або стік втратив Wi-Fi</div></section>`;
  }
  const on = L.gridOn;
  let forText = L.since ? `вже ${dur(L.now - L.since)}` : L.beyondDay ? "понад добу" : "";
  if (!on && !L.since && D && D.outages && D.outages.length) {
    const open = D.outages.find((o) => o[1] === null);
    if (open) forText = `вже ${dur(L.now - open[0])}`;
  }
  const sinceText = L.since ? `${on ? "дали" : "вимкнули"} о ${hm(L.since)}` : "";
  return `<section class="card hero ${on ? "on" : "off"}">
    <div class="emoji">${on ? "💡" : "🕯️"}</div>
    <span class="pill"><span class="dot"></span>${on ? "Мережа є" : "Мережі немає"}</span>
    <div class="big">${on ? "Світло є" : "Світла немає"}</div>
    <div class="for num">${forText}</div>
    <div class="meta sec">${[sinceText, L.voltage !== null ? `${Math.round(L.voltage)} В` : ""].filter(Boolean).join(" · ")}</div>
  </section>`;
}

function batteryAndFlow(L) {
  if (!L || L.error) return "";
  const soc = L.soc;
  const R = 52, C = 2 * Math.PI * R;
  const color = soc === null ? "var(--nodata)" : soc < 20 ? "var(--critical)" : soc < 40 ? "var(--warning)" : "var(--good)";
  const bp = L.batteryPower;
  const mode = soc === null ? "немає даних від BMS" : bp < -20 ? `заряджається · ${-bp} Вт` : bp > 20 ? `розряджається · ${bp} Вт` : "у спокої";
  const ring = `<div class="card ring">
    <svg viewBox="0 0 132 132" role="img" aria-label="Заряд батареї ${soc ?? "невідомо"}%">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--track)" stroke-width="12"/>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${soc === null ? C : C * (1 - soc / 100)}" transform="rotate(-90 66 66)"
        style="transition: stroke-dashoffset .8s ease"/>
      <text x="66" y="66" text-anchor="middle" dominant-baseline="central" style="font-size:28px;font-weight:700;fill:var(--text-primary)">${soc === null ? "—" : soc + "%"}</text>
    </svg>
    <div class="sub sec">${mode}</div>
    ${L.runtimeH ? `<div class="sub" style="font-weight:600">вистачить ≈ ${dur(L.runtimeH * 3600)}</div>` : ""}
  </div>`;

  // power flow: grid → inverter → home, battery ↕
  const gp = L.gridPower, load = L.load;
  const wire = (d, active, rev) => `<path class="wire" d="${d}"/>${active ? `<path class="live${rev ? " rev" : ""}" d="${d}"/>` : ""}`;
  const gridActive = L.gridOn && gp !== null && Math.abs(gp) > 5;
  const loadActive = load !== null && load > 5;
  const batActive = bp !== null && Math.abs(bp) > 20;
  const node = (x, y, icon, label, val) => `<g><circle class="node" cx="${x}" cy="${y}" r="24"/>
    <text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="central" style="font-size:20px">${icon}</text>
    <text x="${x}" y="${y + 40}" text-anchor="middle">${label}</text>
    ${val ? `<text class="val num" x="${x}" y="${y + 56}" text-anchor="middle">${val}</text>` : ""}</g>`;
  const flow = `<div class="card flow"><h2>Потоки енергії</h2>
    <svg viewBox="0 0 320 172" role="img" aria-label="Потоки енергії">
      ${wire("M58 46 H136", gridActive, gp < 0)}
      ${wire("M184 46 H262", loadActive, false)}
      ${wire("M160 70 V112", batActive, bp > 0)}
      ${node(34, 46, L.gridOn ? "⚡" : "✖️", "Мережа", L.gridOn ? `${gp ?? 0} Вт` : "немає")}
      ${node(160, 46, "🔄", "", "")}
      <text x="160" y="14" text-anchor="middle">Інвертор</text>
      ${node(286, 46, "🏠", "Квартира", `${load ?? "—"} Вт`)}
      ${node(160, 136, "🔋", "", "")}
      <text x="196" y="132" class="sec">Батарея</text>
      <text x="196" y="148" class="val num">${bp === null ? "немає даних" : Math.abs(bp) <= 20 ? "у спокої" : `${bp < 0 ? "заряд" : "розряд"} ${Math.abs(bp)} Вт`}</text>
    </svg></div>`;
  return `<div class="row">${ring}${flow}</div>`;
}

function tiles(D) {
  if (!D) return "";
  const w = D.week, b = D.battery, e = D.energy30, g = D.grid30;
  const delta = w.prev_off_h === null || w.prev_off_h === undefined ? "" :
    (() => { const d = w.off_h - w.prev_off_h; return `${d > 0 ? "▲" : d < 0 ? "▼" : "="} ${n1(Math.abs(d))} год до мин. тижня`; })();
  const tile = (k, v, d) => `<div class="tile"><div class="k">${k}</div><div class="v num">${v}</div>${d ? `<div class="d">${d}</div>` : ""}</div>`;
  return `<section class="card"><h2>Останні 7 днів</h2><div class="tiles">
    ${tile("Без світла", `${n1(w.off_h)} <small>год</small>`, delta || `${n1(w.share)}% часу`)}
    ${tile("Відключень", w.count, w.count ? `найдовше ${n1(w.longest_h)} год` : "жодного 🎉")}
    ${tile("Батарея", b.health ? `${b.health}%` : `${n1(b.cycles_total)} цикл.`, b.health ? `ємність ${n1(b.capacity_kwh)} кВт·год` : "ємність ще оцінюється")}
    ${tile("Енергія, 30 днів", `${n1(e.import_kwh)} <small>кВт·год</small>`, `≈ ${Math.round(e.cost_uah || 0)} ₴ з мережі`)}
  </div></section>`;
}

function today(D, L) {
  if (!D) return "";
  const now = L && L.now ? L.now : Date.now() / 1000;
  const p = localParts(now);
  const dayStart = now - (p.h * 3600 + p.m * 60);
  const W = 320, H = 28, x = (t) => ((t - dayStart) / 86400) * W;
  const segs = (D.outages || []).map(([s, e, u]) => [Math.max(s, dayStart), Math.min(e ?? now, now), u, s, e])
    .filter(([s, e]) => e > s);
  const bars = segs.map(([s, e, u, s0, e0]) => `<rect class="hov" x="${x(s)}" y="0" width="${Math.max(2, x(e) - x(s))}" height="${H}" rx="4"
      fill="var(--critical)" data-tip="Без світла ${hm(s0)}–${e0 ? hm(e0) : "зараз"}<br>${u ? "≥ " : ""}${dur((e0 ?? now) - s0)}"/>`).join("");
  const ticks = [0, 6, 12, 18, 24].map((h) => `<text class="axis" x="${(h / 24) * W}" y="${H + 16}" text-anchor="${h === 0 ? "start" : h === 24 ? "end" : "middle"}">${String(h).padStart(2, "0")}</text>`).join("");
  const offTotal = segs.reduce((a, [s, e]) => a + (e - s), 0);
  return `<section class="card"><h2>Сьогодні</h2>
    <div class="chart"><svg viewBox="0 0 ${W} ${H + 20}" role="img" aria-label="Відключення сьогодні">
      <rect x="0" y="0" width="${x(now)}" height="${H}" rx="6" fill="var(--good-soft)"/>
      <rect x="${x(now)}" y="0" width="${W - x(now)}" height="${H}" rx="6" fill="var(--track)" opacity=".5"/>
      ${bars}
      <line x1="${x(now)}" x2="${x(now)}" y1="-4" y2="${H + 4}" stroke="var(--text-primary)" stroke-width="2"/>
      ${ticks}</svg></div>
    <div class="legend"><span><i style="background:var(--good-soft);border:1px solid var(--good)"></i>світло є</span>
      <span><i style="background:var(--critical)"></i>без світла</span>
      <span class="num">${offTotal ? `сьогодні без світла ${dur(offTotal)}` : "сьогодні відключень не було"}</span></div>
  </section>`;
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

function lineChart(rows, idx, opts) {
  const W = 320, H = 120, padL = 30, padB = 18;
  const pts = rows.filter((r) => r[idx] !== null && r[idx] !== undefined);
  if (pts.length < 2) return `<div class="muted" style="font-size:13px">Ще замало даних</div>`;
  const t0 = rows[0][0], t1 = rows[rows.length - 1][0];
  const ymax = opts.max ?? niceMax(Math.max(...pts.map((r) => r[idx])));
  const X = (t) => padL + ((t - t0) / (t1 - t0)) * (W - padL), Y = (v) => (H - padB) * (1 - v / ymax);
  let d = "", prev = null;
  for (const r of pts) {  // break the line across data gaps
    d += (prev === null || r[0] - prev > 1800 ? "M" : "L") + X(r[0]).toFixed(1) + " " + Y(r[idx]).toFixed(1);
    prev = r[0];
  }
  const bands = (opts.outages || []).map(([s, e]) => [Math.max(s, t0), Math.min(e ?? t1, t1)]).filter(([s, e]) => e > s)
    .map(([s, e]) => `<rect x="${X(s)}" y="0" width="${Math.max(1.5, X(e) - X(s))}" height="${H - padB}" fill="var(--critical-soft)"/>`).join("");
  const yt = [0, ymax / 2, ymax].map((v) => `<line class="grid" x1="${padL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/>
    <text class="axis" x="${padL - 6}" y="${Y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join("");
  const days = []; for (let t = t0; t <= t1; t += 86400) days.push(t);
  const xt = days.map((t) => `<text class="axis" x="${X(t)}" y="${H}" text-anchor="middle">${wd(t)}</text>`).join("");
  return `<div class="chart" data-line='${JSON.stringify({ t0, t1, padL, W, idx, unit: opts.unit, label: opts.label })}'>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">
      ${bands}${yt}${xt}
      <path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" x1="0" x2="0" y1="0" y2="${H - padB}" stroke="var(--text-muted)" stroke-width="1" opacity="0"/>
      <circle class="dotc" r="4" fill="var(--series-1)" stroke="var(--card)" stroke-width="2" opacity="0"/>
      <rect class="hit" x="${padL}" y="0" width="${W - padL}" height="${H - padB}" fill="transparent"/>
    </svg></div>`;
}

function week(D) {
  if (!D || !D.series7 || !D.series7.length) return "";
  return `<section class="card"><h2>Заряд батареї, %</h2>${lineChart(D.series7, 1, { max: 100, unit: "%", label: "Заряд", outages: D.outages })}
    <div class="legend"><span><i style="background:var(--series-1)"></i>заряд</span><span><i style="background:var(--critical-soft)"></i>без світла</span>
    ${D.battery && D.battery.coverage < 80 ? `<span>розриви: BMS не передавав дані</span>` : ""}</div></section>
    <section class="card"><h2>Споживання квартири, Вт</h2>${lineChart(D.series7, 2, { unit: " Вт", label: "Споживання", outages: D.outages })}</section>`;
}

function heat(D) {
  if (!D || !D.heatmap28) return "";
  const cw = 12.5, ch = 18, gap = 2, padL = 24, W = padL + 24 * (cw + gap), H = 7 * (ch + gap) + 16;
  const step = (v) => (v <= 0 ? 0 : Math.min(7, 1 + Math.floor(v * 7)));
  let cells = "";
  D.heatmap28.forEach((row, w) => row.forEach((v, h) => {
    cells += `<rect class="hov" x="${padL + h * (cw + gap)}" y="${w * (ch + gap)}" width="${cw}" height="${ch}" rx="3"
      fill="var(--seq-${step(v)})" data-tip="${DAYS[w]}, ${String(h).padStart(2, "0")}:00–${String(h + 1).padStart(2, "0")}:00<br>без світла ${Math.round(v * 100)}% часу"/>`;
  }));
  const ylab = DAYS.map((d, w) => `<text class="axis" x="0" y="${w * (ch + gap) + ch - 5}">${d}</text>`).join("");
  const xlab = [0, 6, 12, 18, 23].map((h) => `<text class="axis" x="${padL + h * (cw + gap) + cw / 2}" y="${H - 2}" text-anchor="middle">${h}</text>`).join("");
  const scale = [0, 1, 2, 3, 4, 5, 6, 7].map((s) => `<i style="background:var(--seq-${s});width:14px;margin:0"></i>`).join("");
  return `<section class="card"><h2>Коли зазвичай немає світла · 4 тижні</h2>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Теплова карта відключень">${ylab}${cells}${xlab}</svg></div>
    <div class="legend"><span>0%</span><span style="display:flex;gap:2px;align-items:center">${scale}</span><span>100% днів</span></div></section>`;
}

function daily(D) {
  if (!D || !D.daily30) return "";
  const rows = D.daily30, W = 320, H = 110, padB = 16, bw = W / rows.length;
  const max = Math.max(60, ...rows.map((r) => r.off_min));
  const bars = rows.map((r, i) => {
    const h = r.off_min ? Math.max(3, (r.off_min / max) * (H - padB - 4)) : 0;
    const x = i * bw + 1, date = new Date(r.date + "T12:00:00");
    const label = date.toLocaleDateString("uk-UA", { day: "numeric", month: "short" });
    const tipText = r.has_data ? `${label}<br>без світла ${r.off_min ? dur(r.off_min * 60) : "0"}${r.load_kwh !== null ? `<br>спожито ${n1(r.load_kwh)} кВт·год` : ""}` : `${label}<br>немає даних`;
    const base = `<rect class="hov" x="${x}" y="0" width="${bw - 2}" height="${H - padB}" fill="transparent" data-tip="${tipText}"/>`;
    if (!r.has_data) return base + `<rect x="${x}" y="${H - padB - 4}" width="${bw - 2}" height="4" rx="2" fill="var(--nodata)"/>`;
    return base + (h ? `<rect x="${x}" y="${H - padB - h}" width="${bw - 2}" height="${h}" rx="3" fill="var(--series-1)" pointer-events="none"/>` : "");
  }).join("");
  const xl = [0, 10, 20, rows.length - 1].map((i) => `<text class="axis" x="${i * bw + bw / 2}" y="${H}" text-anchor="middle">${new Date(rows[i].date + "T12:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "numeric" })}</text>`).join("");
  return `<section class="card"><h2>Години без світла по днях · 30 днів</h2>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Години без світла по днях">
      <line class="grid" x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}"/>${bars}${xl}</svg></div>
    <div class="legend"><span><i style="background:var(--series-1)"></i>без світла</span><span><i style="background:var(--nodata)"></i>немає даних</span></div></section>`;
}

function outageList(D) {
  if (!D || !D.outages) return "";
  const items = D.outages.slice(-8).reverse();
  if (!items.length) return `<section class="card"><h2>Відключення</h2><div class="muted">За 60 днів відключень не було 🎉</div></section>`;
  const now = Date.now() / 1000;
  const li = items.map(([s, e, u]) => `<li><span><b>${dmy(s)}</b> <span class="sec num">${hm(s)}–${e ? hm(e) : "зараз"}</span></span>
    <span class="num">${u ? '<span class="badge" title="поруч була дірка в даних Deye">≥</span> ' : ""}${dur((e ?? now) - s)}</span></li>`).join("");
  return `<section class="card"><h2>Останні відключення</h2><ul class="list">${li}</ul>
    ${items.some((x) => x[2]) ? `<div class="muted" style="font-size:12px;margin-top:8px">≥ — поруч була дірка в даних Deye, реальне відключення могло бути довшим</div>` : ""}
  </section>`;
}

function extra(D) {
  if (!D) return "";
  const b = D.battery, g = D.grid30, e = D.energy30, a = D.alerts30 || {};
  const hints = { F13: "зміна режиму", F25: "батарея", F47: "частота мережі", F56: "низька напруга батареї", F58: "зв'язок з BMS", F64: "перегрів" };
  const chips = Object.keys(a).length ? Object.entries(a).map(([k, v]) => `<span class="chip">⚠️ ${esc(k)} × ${v}${hints[k] ? ` · ${hints[k]}` : ""}</span>`).join("")
    : `<span class="chip">✅ аварій не було</span>`;
  return `<section class="card"><h2>Батарея і мережа · 30 днів</h2><div class="tiles">
      <div class="tile"><div class="k">Віддала батарея</div><div class="v num">${n1(b.discharged_30d)} <small>кВт·год</small></div><div class="d">циклів за весь час ${n1(b.cycles_total)} з ~6000</div></div>
      <div class="tile"><div class="k">Температура, макс.</div><div class="v num">${b.temp_max ?? "—"}° / ${b.inverter_temp_max ?? "—"}°</div><div class="d">батарея / інвертор</div></div>
      <div class="tile"><div class="k">Напруга мережі</div><div class="v num">${g.v_min ?? "—"}–${g.v_max ?? "—"} <small>В</small></div><div class="d">середня ${g.v_avg ?? "—"} В${g.low_pct ? ` · &lt;207 В ${n1(g.low_pct)}%` : ""}</div></div>
      <div class="tile"><div class="k">Спожито квартирою</div><div class="v num">${n1(e.load_kwh)} <small>кВт·год</small></div><div class="d">${e.base_load_w >= 5 ? `вночі ~${e.base_load_w} Вт` : `тариф ${e.tariff} ₴`}</div></div>
    </div>
    ${b.coverage !== null && b.coverage < 80 ? `<div class="chip" style="margin-top:10px;display:inline-block;background:var(--warning-soft)">⚠️ BMS передавав дані лише ${b.coverage}% часу</div>` : ""}
    <h2 style="margin-top:16px">Аварії Deye</h2><div class="chips">${chips}</div></section>`;
}

function footer(L) {
  const g = state.generated_at ? hm(state.generated_at) : "—";
  const l = L && L.updated ? hm(L.updated) : "—";
  return `<footer>живі дані Deye на ${l} · статистика на ${g}<br><button class="refresh" onclick="refresh()">↻ Оновити</button></footer>`;
}

// ---------- hover layer
function bindHovers() {
  document.querySelectorAll("[data-tip]").forEach((el) => {
    const on = (e) => showTip(e, el.getAttribute("data-tip"));
    el.addEventListener("pointermove", on); el.addEventListener("pointerdown", on);
    el.addEventListener("pointerleave", hideTip);
  });
  document.querySelectorAll("[data-line]").forEach((box) => {
    const cfg = JSON.parse(box.getAttribute("data-line"));
    const svg = box.querySelector("svg"), hit = box.querySelector(".hit"), cross = box.querySelector(".cross"), dot = box.querySelector(".dotc");
    const rows = state.data.series7.filter((r) => r[cfg.idx] !== null);
    const move = (e) => {
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const p = pt.matrixTransform(svg.getScreenCTM().inverse());
      const t = cfg.t0 + ((p.x - cfg.padL) / (cfg.W - cfg.padL)) * (cfg.t1 - cfg.t0);
      let best = rows[0];
      for (const r of rows) if (Math.abs(r[0] - t) < Math.abs(best[0] - t)) best = r;
      const x = cfg.padL + ((best[0] - cfg.t0) / (cfg.t1 - cfg.t0)) * (cfg.W - cfg.padL);
      const ymax = cfg.idx === 1 ? 100 : null;
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", ".6");
      const yy = (() => { const H = 120, padB = 18, max = ymax ?? niceMax(Math.max(...rows.map((r) => r[cfg.idx]))); return (H - padB) * (1 - best[cfg.idx] / max); })();
      dot.setAttribute("cx", x); dot.setAttribute("cy", yy); dot.setAttribute("opacity", "1");
      showTip(e, `${wd(best[0])} ${dmy(best[0])}, ${hm(best[0])}<br><b>${Math.round(best[cfg.idx])}${cfg.unit}</b>`);
    };
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("opacity", "0"); dot.setAttribute("opacity", "0"); });
  });
}

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
</script>
